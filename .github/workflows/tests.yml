name: tests

# Manual trigger only for now. Switch back to push / pull_request once
# GitHub Actions is available on this account.
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip freeze | grep -i -E "ortools|matplotlib"
      - run: pytest -v
      - run: python src/main.py --loans 10 --time-limit 20
