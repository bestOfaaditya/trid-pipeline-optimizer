name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip freeze | grep -i -E "ortools|matplotlib"
      - run: pytest -v
      - run: python src/main.py --loans 10 --time-limit 20
